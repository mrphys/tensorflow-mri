name: build

on:
  push:
    branches:
      - master
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches:
      - master

jobs:

  build:

    name: Build package
    runs-on: ubuntu-24.04 # ubuntu-latest

    container:
      image: ghcr.io/mrphys/tensorflow-manylinux:1.14.0

    strategy:
      matrix:
        py_version: ["3.8", "3.9", "3.10"] #, "3.11", "3.12", "3.13"]

    env:
      PYTHON: python${{ matrix.py_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space Before Build
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Lint code
        run: |
          make lint PY_VERSION=${{ matrix.py_version }}

      - name: Compile shared library
        run: |
          make PY_VERSION=${{ matrix.py_version }} CXX=/dt9/usr/bin/g++

      - name: Install required packages
        run: |
          $PYTHON -m pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        run: |
          make test PY_VERSION=${{ matrix.py_version }}

      - name: Build wheel
        run: |
          make wheel PY_VERSION=${{ matrix.py_version }}

      - name: Build docs
        run: |
          make docs PY_VERSION=${{ matrix.py_version }}

      - name: Upload wheel
        if: startsWith(github.ref, 'refs/tags')
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.py_version }}
          path: ./artifacts/*.whl

      - name: Upload docs
        if: startsWith(github.ref, 'refs/tags') && matrix.py_version == 3.9
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./tools/docs/_build/dirhtml

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.7
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: artifacts/
          skip-existing: true

      - name: Free Disk Space After Build
        run: |
          echo "Disk space before post-build cleanup:"
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          sudo apt-get clean
          echo "Disk space after post-build cleanup:"
          df -h

  release:

    name: Release
    needs: build
    runs-on: ubuntu-24.04 # ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')

    steps:

      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs

      - name: Clean docs branch
        run: |
          rm -rf ./*

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs

      - name: Publish docs to GitHub Pages
        run: |
          git config --global user.name mrphys
          git config --global user.email mrphys@users.noreply.github.com
          git add -A
          git commit -m "Update docs [bot]" || echo "No changes to commit."
          git push --force

      - name: Checkout master
        uses: actions/checkout@v4

      - name: Get release tag
        run: |
          echo "release=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Create a release
        uses: softprops/action-gh-release@v1
        with:
          name: TensorFlow MRI ${{ env.release }}
          body_path: RELEASE.rst
          prerelease: ${{ contains(env.release, 'a') || contains(env.release, 'b') || contains(env.release, 'rc') }}
          fail_on_unmatched_files: true

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: wheel-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.7
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: artifacts/
  paper:
    runs-on: ubuntu-24.04 # ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      #- name: Build draft PDF
      #  uses: openjournals/openjournals-draft-action@master
      - name: Open Journals PDF Generator
        uses: openjournals/openjournals-draft-action@v.1.0
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper.pdf
